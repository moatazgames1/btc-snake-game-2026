<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#193d25"><title>BTC Snake — HD Nature Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182f25;color:#fff;font-family:system-ui,Arial}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:8px}.top>*{pointer-events:auto}.pill,.back,.reset{background:#10251ddd;border:1px solid #d8f5c755;border-radius:13px;color:white;padding:9px 12px;text-decoration:none;font-size:13px;box-shadow:0 5px 20px #0005}.pill b{color:#d7b45a}.hint{position:fixed;top:62px;left:12px;right:12px;text-align:center;font-size:12px;text-shadow:0 2px 6px #000;pointer-events:none;color:#f4ffe9}.joy{position:fixed;left:18px;bottom:20px;width:124px;height:124px;border-radius:50%;border:2px solid #ffffff88;background:#13291e99;box-shadow:inset 0 0 20px #fff2;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(145deg,#fff0b0,#b68b35);border:2px solid #fff;box-shadow:0 3px 15px #0008;pointer-events:none}.label{position:fixed;left:22px;bottom:150px;font-size:11px;text-shadow:0 2px 5px #000}.reset{position:fixed;right:18px;bottom:22px}
</style>
</head>
<body>
<div id="game"></div>
<div class="top"><a class="back" href="./">← العودة للعبة الأصلية</a><div class="pill">🐍 <b>BTC SNAKE · تجربة HD</b></div></div>
<div class="hint">تجربة بصرية مستقلة · حرّك عصا التحكم لاستكشاف الخريطة</div>
<div class="label">عصا التحكم</div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="reset" id="reset">إعادة البداية ↻</button>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
const host=document.getElementById("game"),scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bbbd0);scene.fog=new THREE.FogExp2(0xa8c1c2,.0065);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,320);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdceeff,0x53613b,1.65));
const sun=new THREE.DirectionalLight(0xffe3b0,3.1);sun.position.set(-42,65,24);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;sun.shadow.bias=-.00025;scene.add(sun);
// Natural grass texture
const texCanvas=document.createElement("canvas");texCanvas.width=texCanvas.height=512;const ctx=texCanvas.getContext("2d");ctx.fillStyle="#527d3b";ctx.fillRect(0,0,512,512);
for(let i=0;i<26000;i++){const x=Math.random()*512,y=Math.random()*512;ctx.strokeStyle=["#315c2e","#477337","#72934a","#91a85b","#3d6930","#b0b66b"][i%6];ctx.globalAlpha=.18+Math.random()*.4;ctx.lineWidth=.5+Math.random()*1.1;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-2,y-4,x+(Math.random()-.5)*5,y-3-Math.random()*8);ctx.stroke()}ctx.globalAlpha=1;
const grassTex=new THREE.CanvasTexture(texCanvas);grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(22,22);grassTex.colorSpace=THREE.SRGBColorSpace;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({map:grassTex,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const earth=new THREE.Mesh(new THREE.CylinderGeometry(110,110,3,80),new THREE.MeshStandardMaterial({color:0x59412d,roughness:1}));earth.position.y=-1.7;scene.add(earth);
// distant mountain silhouettes
const rockMat=new THREE.MeshStandardMaterial({color:0x65786a,roughness:1});
for(let i=0;i<18;i++){const a=i/18*Math.PI*2,r=105+Math.random()*12,m=new THREE.Mesh(new THREE.ConeGeometry(12+Math.random()*12,23+Math.random()*25,7),rockMat);m.position.set(Math.cos(a)*r,8,Math.sin(a)*r);m.rotation.y=Math.random()*2;scene.add(m)}
// Tree groups, instanced-like shared geometry/materials
const bark=new THREE.MeshStandardMaterial({color:0x59402b,roughness:1}),leaves=[0x294f2e,0x37683a,0x4b7540].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.95}));
const trunkGeo=new THREE.CylinderGeometry(.22,.42,3.8,8),crownGeo=new THREE.IcosahedronGeometry(1.8,1);
for(let i=0;i<105;i++){const a=Math.random()*Math.PI*2,r=17+Math.random()*78,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x,z)<14)continue;const group=new THREE.Group();group.position.set(x,0,z);const h=2.1+Math.random()*2.2;const tr=new THREE.Mesh(trunkGeo,bark);tr.scale.y=h/3.8;tr.position.y=h/2;tr.castShadow=true;group.add(tr);for(let j=0;j<3;j++){const crown=new THREE.Mesh(crownGeo,leaves[(i+j)%3]);crown.scale.set(.85+Math.random()*.35,.8+Math.random()*.5,.85+Math.random()*.35);crown.position.set((Math.random()-.5)*.7,h+j*.75, (Math.random()-.5)*.6);crown.castShadow=true;group.add(crown)}scene.add(group)}
// stones and grass tufts
const stoneMat=new THREE.MeshStandardMaterial({color:0x77796c,roughness:1});
for(let i=0;i<85;i++){const a=Math.random()*Math.PI*2,r=9+Math.random()*86,stone=new THREE.Mesh(new THREE.DodecahedronGeometry(.45+Math.random()*1.1,1),stoneMat);stone.position.set(Math.cos(a)*r,.25,Math.sin(a)*r);stone.scale.y=.55;stone.rotation.set(Math.random(),Math.random(),Math.random());stone.castShadow=true;scene.add(stone)}
// Player snake: natural emerald-green scales, smooth connected body
const snake=new THREE.Group();scene.add(snake);
const black=new THREE.MeshStandardMaterial({color:0x176b35,metalness:.12,roughness:.34});
const gold=new THREE.MeshStandardMaterial({color:0x79bd45,metalness:.18,roughness:.3});
const bellyMat=new THREE.MeshStandardMaterial({color:0x397d3d,metalness:.08,roughness:.55});
const head=new THREE.Mesh(new THREE.SphereGeometry(.72,32,24),black);head.scale.set(1.3,.78,1);head.position.y=.78;head.castShadow=true;snake.add(head);
const snout=new THREE.Mesh(new THREE.SphereGeometry(.42,24,16),black);snout.scale.set(1.15,.65,.8);snout.position.set(.52,.62,0);snake.add(snout);
for(const side of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.15,18,14),new THREE.MeshStandardMaterial({color:0xe9c66b,metalness:.35,roughness:.2}));eye.position.set(.32,1.02,side*.48);snake.add(eye);const pupil=new THREE.Mesh(new THREE.SphereGeometry(.075,14,10),new THREE.MeshStandardMaterial({color:0x080a0b}));pupil.position.set(.39,1.04,side*.55);snake.add(pupil)}
// Body sections with subtle gold scale bands
const body=[];const scaleGeo=new THREE.SphereGeometry(1,20,16);
for(let i=0;i<24;i++){const g=new THREE.Group();const radius=.52-i*.014;const core=new THREE.Mesh(scaleGeo,black);core.scale.set(1,radius*1.35,radius);core.position.y=.53;core.castShadow=true;g.add(core);const band=new THREE.Mesh(new THREE.TorusGeometry(radius*.9,.035,6,18),gold);band.rotation.x=Math.PI/2;band.position.y=.64;g.add(band);snake.add(g);body.push(g)}
let pos=new THREE.Vector3(0,0,0),heading=0,steer=0,throttle=0;const trail=[];
for(let i=0;i<180;i++)trail.push(new THREE.Vector3(0,0,i*.24));
function updateSnake(){snake.position.set(pos.x,0,pos.z);snake.rotation.y=heading;for(let i=0;i<body.length;i++){const p=trail[Math.min((i+1)*5,trail.length-1)];body[i].position.set(p.x-pos.x,0,p.z-pos.z);body[i].rotation.y=Math.atan2((trail[Math.min((i+1)*5-1,trail.length-1)].x-p.x),(trail[Math.min((i+1)*5-1,trail.length-1)].z-p.z))}}
const joy=document.getElementById("joy"),knob=document.getElementById("knob");let pointer=null;
function joyMove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=43,len=Math.hypot(dx,dy),k=Math.min(1,max/(len||1));knob.style.left=(50+dx*k/r.width*100)+"%";knob.style.top=(50+dy*k/r.height*100)+"%";steer=dx*k/max;throttle=-dy*k/max}
function release(){pointer=null;steer=0;throttle=0;knob.style.left="50%";knob.style.top="50%"}
joy.addEventListener("pointerdown",e=>{pointer=e.pointerId;joy.setPointerCapture(pointer);joyMove(e)});joy.addEventListener("pointermove",e=>{if(e.pointerId===pointer)joyMove(e)});joy.addEventListener("pointerup",release);joy.addEventListener("pointercancel",release);
addEventListener("keydown",e=>{if(["ArrowLeft","a","A"].includes(e.key))steer=1;if(["ArrowRight","d","D"].includes(e.key))steer=-1;if(["ArrowUp","w","W"].includes(e.key))throttle=1;if(["ArrowDown","s","S"].includes(e.key))throttle=-.45});
addEventListener("keyup",e=>{if(["ArrowLeft","a","A","ArrowRight","d","D"].includes(e.key))steer=0;if(["ArrowUp","w","W","ArrowDown","s","S"].includes(e.key))throttle=0});
function reset(){pos.set(0,0,0);heading=0;trail.length=0;for(let i=0;i<180;i++)trail.push(new THREE.Vector3(0,0,i*.24));updateSnake()}document.getElementById("reset").onclick=reset;
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);heading+=steer*dt*1.65;const speed=throttle>.05?5.1:throttle<-.05?-2:0;pos.x+=Math.sin(heading)*speed*dt;pos.z+=Math.cos(heading)*speed*dt;trail.unshift(new THREE.Vector3(pos.x,0,pos.z));if(trail.length>180)trail.pop();updateSnake();const desired=new THREE.Vector3(pos.x-Math.sin(heading)*10,6.3,pos.z-Math.cos(heading)*10);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(pos.x,1,pos.z);renderer.render(scene,camera)}
animate();addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
